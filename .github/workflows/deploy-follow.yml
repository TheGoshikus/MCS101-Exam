# Автодеплой лендинга FOLLOW на Cloudflare Pages (проект follow, домен follow.com.ai).
# master → боевой сайт follow.com.ai. Остальные ветки сайт не трогают.
# Нужны секреты репозитория: CLOUDFLARE_API_TOKEN (право "Cloudflare Pages: Edit")
# и CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions).
name: Deploy FOLLOW to follow.com.ai

on:
  push:
    branches: [master]
    paths: ['follow/**', '.github/workflows/deploy-follow.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: follow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://follow.com.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check API syntax
        run: node --check 'follow/functions/api/[[path]].js' && node --check follow/app.js
      - name: Deploy
        working-directory: follow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./deploy.sh main
      - name: Smoke test
        run: |
          sleep 15
          curl -fsS -o /dev/null -w "home %{http_code}\n" https://follow.com.ai/
          curl -fsS -o /dev/null -w "ru %{http_code}\n" https://follow.com.ai/ru/
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://follow.com.ai/api/early-access \
            -H 'Content-Type: application/json' -d '{"email":"not-an-email","website":""}')
          echo "api $code"; [ "$code" = "422" ]
